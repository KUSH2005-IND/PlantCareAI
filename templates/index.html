<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantCare AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
    background: #f4f4f4;
}

.container {
    background: white;
    padding: 30px;
    width: 400px;
    max-width: 90%;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.15);
    text-align: left;
}

h2, .subtitle {
    text-align: center;
}

.subtitle {
    color: #555;
    font-size: 14px;
    margin-bottom: 20px;
}

.field {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    margin-bottom: 6px;
}

select, input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 14px;
    background: #fff;
}

button {
    width: 100%;
    padding: 11px 20px;
    background: #2ecc71;
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 6px;
}

button:hover {
    background: #27ae60;
}

.error {
    color: #e74c3c;
    text-align: center;
    font-size: 14px;
    margin-top: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>PlantCare AI</h2>
    <p class="subtitle" id="subtitle">Upload a leaf image to detect plant disease</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="field">
            <label for="mode">Scan Type</label>
            <select name="mode" id="mode">
                <option value="disease" selected>Leaf Disease</option>
                <option value="pest">Insect Pest (YOLO26n)</option>
            </select>
        </div>

        <div class="field" id="crop-group" style="display: none;">
            <label for="crop">Host Crop Filter (Optional)</label>
            <select name="crop" id="crop">
                {% for c in crops or ['all', 'rice', 'corn', 'wheat', 'beet', 'alfalfa', 'vitis', 'citrus', 'mango'] %}
                    <option value="{{ c }}">{{ 'All Crops (102 Classes)' if c == 'all' else c|capitalize }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="image">Plant / Pest Image</label>
            <input type="file" name="image" id="image" accept="image/*" required>
        </div>

        <button type="submit" id="submit-btn">Predict Disease</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</div>

<script>
const modeSelect = document.getElementById("mode");
const cropGroup = document.getElementById("crop-group");
const subtitle = document.getElementById("subtitle");
const submitBtn = document.getElementById("submit-btn");

modeSelect.addEventListener("change", () => {
    const isPest = modeSelect.value === "pest";
    cropGroup.style.display = isPest ? "block" : "none";
    subtitle.textContent = isPest
        ? "Upload a crop or insect image to detect pests"
        : "Upload a leaf image to detect plant disease";
    submitBtn.textContent = isPest ? "Detect Pest" : "Predict Disease";
});
</script>

</body>
</html>
