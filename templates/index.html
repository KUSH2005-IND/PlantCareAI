<!DOCTYPE html>
<html>
<head>

<title>PlantCare AI</title>

<style>

body{
font-family: Arial;
text-align:center;
margin-top:50px;
background:#f4f4f4;
}

.container{
background:white;
padding:30px;
width:400px;
margin:auto;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

button{
padding:10px 20px;
background:#2ecc71;
border:none;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<div class="container">

<h2>PlantCare AI</h2>

<p>Upload a leaf image to detect plant disease</p>

<form method="POST" enctype="multipart/form-data">

<input type="file" name="image" required>

<br><br>

<button type="submit">Predict Disease</button>

</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
