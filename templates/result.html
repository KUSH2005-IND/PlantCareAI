<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<style>

body{
font-family: Arial;
text-align:center;
margin-top:50px;
background:#f4f4f4;
}

.container{
background:white;
padding:30px;
width:450px;
margin:auto;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

img{
margin-top:20px;
border-radius:10px;
}

button{
padding:10px 20px;
background:#3498db;
border:none;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#2980b9;
}

</style>

</head>

<body>

<div class="container">

<h2>Disease Prediction</h2>

<img src="{{ image }}" width="300">

<h3>{{ prediction }}</h3>

<p>Confidence: {{ confidence }}%</p>

<br>

<a href="/">
<button>Upload Another Image</button>
</a>

</div>

</body>
</html>
